<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Homework worksheet · THU EEE</title>
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="worksheet.css">
  <script defer src="circuits.js"></script><script defer src="questions.js"></script><script defer src="course.js"></script>
  <script defer src="practice-models.js"></script><script defer src="worksheet.js"></script>
</head>
<body>
  <header class="print-controls">
    <div class="toolbar-heading"><a href="index.html" id="back">← Back to practice</a><h1>Homework worksheet</h1><button id="print" type="button" class="primary">Print / Save PDF</button></div>
    <div class="options">
      <label>Homework<select id="sheet-homework"></select></label>
      <label>Exercises<select id="sheet-mode"><option value="official">Official homework</option><option value="random">Random practice</option></select></label>
      <label id="seed-control" hidden>Sheet number<input id="sheet-seed" type="number" min="1" max="4294967295" step="1" required></label>
      <button id="sheet-new" type="button" hidden>New numbers</button>
      <label class="checkbox"><input id="sheet-answers" type="checkbox">Include answer key</label>
    </div>
    <p>One exercise per A4 page, with space for working. Choose “Save to PDF” in the print dialog. Turn off browser headers and footers.</p>
    <div id="sheet-status" role="status" aria-live="polite"></div>
  </header>
  <main id="sheets" aria-label="Worksheet preview"></main>
</body>
</html>
