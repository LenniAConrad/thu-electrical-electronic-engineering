name: Test and publish site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Check answers and generated exercises
        run: |
          node test-checker.cjs
          node test-models.cjs
          node test-review.cjs
          node test-course.cjs
          node test-circuit-solver.cjs
          node test-circuit-flow.cjs
          node test-exercise-playgrounds.cjs
          node test-hw3.cjs
      - name: Build static site
        run: node build-site.cjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .build/site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
